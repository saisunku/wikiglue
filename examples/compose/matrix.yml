# Synapse + Postgres for the tailnet-only Matrix server.
# Synapse is published on 127.0.0.1 only;
# a reverse proxy (Caddy here) is the only way in.
name: wiki-matrix

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /etc/wiki-matrix/postgres.env
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - /var/lib/wiki-matrix/postgres:/var/lib/postgresql/data
    networks: [internal]

  synapse:
    image: ghcr.io/element-hq/synapse:v1.163.2
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - /var/lib/wiki-matrix/synapse:/data
    ports:
      - "127.0.0.1:8008:8008"
    # `internal` for Postgres; `egress` only so push notifications reach the push gateway.
    networks: [internal, egress]

networks:
  internal:
    internal: true
  egress: {}
