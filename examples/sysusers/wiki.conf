# Service users and the wiki group. /etc/wikiguard.nft names every user below, and nftables
# refuses the whole rule table if one of them is missing, so create these first, even for
# parts you don't run yet (the site, mail, Caddy, certificates, metrics).
# Install as /etc/sysusers.d/wiki.conf, then: sudo systemd-sysusers. Existing users are kept.
#Type Name        ID  GECOS                              Home
g     wiki        -
u     llm         -   "llama.cpp model server"           /var/lib/llm
u     wikibot     -   "wiki agent (pi)"                  /var/lib/wikibot
u     wikiglue    -   "wikiglue (chat, bookmarks, email)" /var/lib/wikiglue
m     wikiglue    wiki
u     wikisite    -   "wiki site build and server"       /var/lib/wiki-site
u     wikimail    -   "Family Wiki mail download"        /var/lib/wikimail
u     caddy       -   "Caddy web server"                 /var/lib/caddy
u     acme        -   "certificate renewal (lego)"       /var/lib/acme
u     wikimetrics -   "metrics dashboard (Alloy)"        /var/lib/wiki-metrics
